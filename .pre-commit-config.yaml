repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff
        args: ["format", "."]
        language: system
        pass_filenames: false
      - id: ruff
        name: ruff
        entry: uv run --frozen ruff
        args: ["check", "--fix", "."]
        language: system
        pass_filenames: false
      - id: ty
        name: ty
        entry: .venv/bin/python -m ty check
        language: system
        pass_filenames: false
      - id: frontend-lint
        name: frontend lint
        entry: make frontend-lint
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: frontend-typecheck
        name: frontend typecheck
        entry: make frontend-typecheck
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: frontend-test
        name: frontend test
        entry: make frontend-test
        language: system
        pass_filenames: false
        files: ^frontend/
        stages: [pre-push]
      - id: local-ci
        name: local CI parity check
        entry: make ci
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
